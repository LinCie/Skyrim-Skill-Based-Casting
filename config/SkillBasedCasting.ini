[General]
; Allow NPC actors to benefit from skill-based casting speed progression.
bEnableNPCSupport = true

[Progression]
; Historically named multiplier settings; these contribute to a SPEED FACTOR.
; actual charge time = vanilla charge time / (minimum speed + skill * speed per level)
fMinChargeTimeMultiplier = 0.5
fChargeTimeMultiplier = 0.01
iMaxSkillLevel = 100

[Debug]
; Log each supported charge-time adjustment. Disabled by default.
bEnableDebugLogging = false
